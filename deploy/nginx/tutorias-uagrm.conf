# Nginx — Sistema de Tutorías UAGRM
# Copiar a /etc/nginx/sites-available/tutorias-uagrm y enlazar en sites-enabled.
# Reemplazar tutorias.example.com por el dominio real (o la IP del VPS).
# HTTPS: ejecutar `sudo certbot --nginx -d tutorias.example.com` después de la primera carga.

server {
    listen 80;
    listen [::]:80;
    server_name tutorias.example.com;

    root /var/www/tutorias-uagrm/public;
    index index.php;

    charset utf-8;

    # Documentos PDF de solicitudes (5 MB c/u) y fotos de perfil.
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Ningún otro .php es ejecutable; archivos ocultos (.env, .git) bloqueados.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/tutorias-uagrm.access.log;
    error_log  /var/log/nginx/tutorias-uagrm.error.log;
}
