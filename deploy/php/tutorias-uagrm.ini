; PHP-FPM — Sistema de Tutorías UAGRM
; Copiar a /etc/php/8.4/fpm/conf.d/99-tutorias-uagrm.ini y recargar php8.4-fpm.

upload_max_filesize = 12M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60
date.timezone = America/La_Paz
expose_php = Off

; OPcache (producción): el código solo cambia al desplegar.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
